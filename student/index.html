<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>اختبار الحركة في بُعد واحد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: one centered exam card per screen; header band in school navy, lime accents for progress */
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#1b2340; --muted:#5d6785; --line:#dde2ee;
  --navy:#24397c; --navy-ink:#ffffff; --lime:#7cbb2f; --lime-soft:#eef7e2; --gold:#e9a923;
  --sel:#e6ebfa; --sel-line:#24397c; --ok:#2e7d32; --bad:#c62828; --warn:#b26a00;
  --grid:#e3e7f1; --axis:#4a5372; --plot:#c62828;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1426; --card:#171e36; --ink:#e7ebf7; --muted:#9aa4c4; --line:#2a3354;
  --navy:#3b56b0; --navy-ink:#ffffff; --lime:#8fd03e; --lime-soft:#1e2b17; --gold:#f0b93f;
  --sel:#22305e; --sel-line:#8fa6ff; --ok:#66bb6a; --bad:#ef5350; --warn:#ffb74d;
  --grid:#2a3354; --axis:#aab3d3; --plot:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1426; --card:#171e36; --ink:#e7ebf7; --muted:#9aa4c4; --line:#2a3354;
  --navy:#3b56b0; --navy-ink:#ffffff; --lime:#8fd03e; --lime-soft:#1e2b17; --gold:#f0b93f;
  --sel:#22305e; --sel-line:#8fa6ff; --ok:#66bb6a; --bad:#ef5350; --warn:#ffb74d;
  --grid:#2a3354; --axis:#aab3d3; --plot:#ff6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.band{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:58px;height:auto}
.band h1{font-family:var(--f-head);font-size:1.15rem;margin:0;line-height:1.5;text-wrap:balance}
.band p{margin:0;opacity:.85;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-family:var(--f-head);font-size:1.25rem;margin:0 0 6px;text-wrap:balance}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.rule{background:var(--lime-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.rule b{display:block;font-family:var(--f-head);font-size:1.15rem;color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 200px;min-width:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--navy);color:var(--navy-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{font-size:.85rem;padding:4px 12px;border-radius:999px;background:var(--sel);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s}
.qtype{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.qtext{font-size:1.12rem;font-weight:500;margin:6px 0 10px}
.m{direction:ltr;unicode-bidi:isolate;font-family:var(--f-math);font-size:1.08em;white-space:nowrap}
.fig{direction:ltr;display:flex;justify-content:center;margin:6px 0 12px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.fig svg text{font-family:var(--f-body);fill:var(--axis)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sel);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.opt[aria-pressed="true"] .k{background:var(--navy);color:var(--navy-ink)}
.tf{grid-template-columns:1fr 1fr}
.note{font-size:.88rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.score{font-family:var(--f-head);font-size:2.6rem;color:var(--navy);margin:4px 0}
:root[data-theme="dark"] .score{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score{color:var(--lime)}}
.code{direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px;word-break:break-all;user-select:all}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--sel)}
td.ok{color:var(--ok);font-weight:700}td.bad{color:var(--bad);font-weight:700}
.prev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.prev .opt{cursor:default}
.prev .opt.right{border-color:var(--ok);background:var(--lime-soft)}
.stars{color:var(--gold);letter-spacing:2px}
@media (max-width:480px){.tf{grid-template-columns:1fr}.band h1{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<style>body{margin:0}</style>

    <div>
      <h1>روضة ومدارس ربوع البشر النموذجية</h1>
      <p>الفيزياء · الصف العاشر · اختبار قصير: الحركة في بُعد واحد</p>
    </div>
  </header>
  <main id="view" class="card" aria-live="polite"></main>
</div>

<script>
"use strict";
/* ============ the only setting to edit: your Supabase function address ============ */
const API = "https://iwssxlmdhdaanifbfzrt.supabase.co/functions/v1/quiz";
/* ===================================================================================
   This page holds NO questions bank, NO answers, NO student list and NO grading.
   It only shows what the server sends and forwards the student's choice.
   The token below is a convenience to survive a page refresh; the server decides
   everything (time, attempt, order, score).
   =================================================================================== */
const AR = ["أ","ب","ج","د"];
const view = document.getElementById("view");
let token = null, timerId = null, offset = 0, busy = false, pendingCode = null;
try { token = sessionStorage.getItem("quiz_token"); } catch (e) {}
const saveToken = t => { token = t; try { t ? sessionStorage.setItem("quiz_token", t) : sessionStorage.removeItem("quiz_token"); } catch (e) {} };
const clearTimer = () => { if (timerId) { clearInterval(timerId); timerId = null; } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const EN_DT = d => new Date(d).toLocaleString("en-GB", { timeZone: "Asia/Amman", weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
const EN_T = d => new Date(d).toLocaleTimeString("en-US", { timeZone: "Asia/Amman", hour: "numeric", minute: "2-digit" });

async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch (e) {}
  return j || { ok: false, error: "network" };
}
const MSG = {
  invalid_id: "الرقم الوطني غير موجود في قائمة الشعبة. تأكّد منه أو راجع معلمك.",
  too_many_attempts: "محاولات كثيرة غير صحيحة. انتظر 10 دقائق ثم حاول مرة أخرى.",
  session_invalid: "انتهت الجلسة. أدخل رقمك الوطني مرة أخرى لمتابعة اختبارك من حيث توقفت.",
  network: "تعذّر الاتصال بالخادم. تحقّق من الإنترنت وأعد المحاولة.",
  server_error: "حدث خطأ في الخادم. أعد المحاولة بعد قليل.",
};

function loginView(msg) {
  clearTimer();
  view.innerHTML = `
  <h2>اختبار قصير: الحركة في بُعد واحد</h2>
  <p class="note">منحنى الموقع–الزمن · منحنى السرعة–الزمن · الحركة المنتظمة · معادلات الحركة بتسارع ثابت</p>
  <div class="rules">
    <div class="rule"><b>11</b>سؤالًا: 8 اختيار من متعدد و3 صح وخطأ</div>
    <div class="rule"><b>20 دقيقة</b>يُحسب الوقت على الخادم ويُغلق الاختبار تلقائيًا</div>
    <div class="rule"><b>اتجاه واحد</b>لا يمكن الرجوع إلى سؤال بعد تأكيد إجابته</div>
  </div>
  <form id="f" novalidate autocomplete="off">
    <label for="nid">الرقم الوطني</label>
    <input id="nid" type="password" inputmode="numeric" maxlength="10" autocomplete="off" dir="ltr" style="text-align:center;letter-spacing:.25em;font-size:1.3rem">
    <div class="err" id="err">${msg ? esc(msg) : ""}</div>
    <div class="foot"><span class="note">يُرسل الرقم إلى خادم المدرسة للتحقق فقط ولا يُحفظ في هذه الصفحة.</span><button class="btn" type="submit" id="go">دخول</button></div>
  </form>`;
  const inp = document.getElementById("nid");
  inp.addEventListener("input", () => { inp.value = inp.value.replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, "").slice(0, 10); });
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault(); if (busy) return;
    const nid = inp.value;
    if (nid.length !== 10) { document.getElementById("err").textContent = "الرقم الوطني يتكوّن من 10 أرقام."; return; }
    inp.value = "";
    await doLogin(nid);
  });
}

async function doLogin(nid) {
  busy = true; const go = document.getElementById("go"); if (go) go.disabled = true;
  const r = await call({ action: "login", national_id: nid });
  busy = false; if (go) go.disabled = false;
  if (!r.ok) { pendingCode = null; loginView(MSG[r.error] || MSG.server_error); return; }
  if (r.status === "not_open") { pendingCode = nid; waitView(r); return; }
  pendingCode = null;
  if (r.status === "closed") { closedView(r); return; }
  if (r.token) saveToken(r.token);
  render(r);
}

function waitView(r) {
  clearTimer(); offset = new Date(r.now) - Date.now();
  view.innerHTML = `<h2>الاختبار لم يُفتح بعد</h2>
  <p>يُفتح الاختبار في الموعد الآتي. أبقِ هذه الصفحة مفتوحة وسيُتحقّق من رقمك ويبدأ الاختبار تلقائيًا عند الوقت:</p>
  <div class="code" style="text-align:center;font-family:var(--f-body)">${esc(EN_DT(r.opens_at))} – ${esc(EN_T(r.closes_at))} (Amman time)</div>
  <p class="note" dir="ltr" style="margin-top:12px;text-align:center">Opens in <b class="timer" id="cd"></b></p>`;
  const cd = document.getElementById("cd"), opens = new Date(r.opens_at).getTime();
  const tick = () => { const left = opens - (Date.now() + offset);
    if (left <= 0) { clearTimer(); if (pendingCode) doLogin(pendingCode); return; }
    const d = Math.floor(left / 864e5), h = Math.floor(left % 864e5 / 36e5), m = Math.floor(left % 36e5 / 6e4), s = Math.floor(left % 6e4 / 1e3);
    cd.textContent = (d ? d + "d " : "") + [h, m, s].map(x => String(x).padStart(2, "0")).join(":"); };
  tick(); timerId = setInterval(tick, 1000);
}

function closedView(r) {
  clearTimer();
  view.innerHTML = `<h2>انتهى وقت الاختبار</h2><p>أُغلق الاختبار. كان موعده:</p>
  <div class="code" style="text-align:center;font-family:var(--f-body)">${esc(EN_DT(r.opens_at))} – ${esc(EN_T(r.closes_at))} (Amman time)</div>`;
}

function render(r) {
  if (r.status === "in_progress") questionView(r);
  else resultView(r);
}

function questionView(r) {
  clearTimer(); offset = new Date(r.now) - Date.now();
  const q = r.question; let pick = null;
  view.innerHTML = `
  <div class="top"><span class="pill">${esc(r.name)} · النموذج ${r.form}</span><span class="timer" id="tm"></span></div>
  <div class="bar" style="margin:12px 0 16px"><i style="width:${(r.index / r.total) * 100}%"></i></div>
  <div class="qtype">السؤال ${r.index + 1} من ${r.total} · ${q.kind === "mc" ? "ضع دائرة حول رمز الإجابة الصحيحة" : "صح أم خطأ"}</div>
  <div class="qtext">${q.text}</div>
  ${q.fig || ""}
  <div class="opts ${q.kind === "tf" ? "tf" : ""}">
    ${q.options.map((o, j) => `<button type="button" class="opt" aria-pressed="false" data-j="${j}"><span class="k">${q.kind === "mc" ? AR[j] : (j === 0 ? "✓" : "✗")}</span><span>${o}</span></button>`).join("")}
  </div>
  <div class="err" id="err"></div>
  <div class="foot"><span class="note">بعد التأكيد ينتقل الاختبار إلى السؤال التالي ولا يمكن الرجوع.</span><button class="btn" id="go" disabled>${r.index === r.total - 1 ? "تأكيد وتسليم الاختبار" : "تأكيد والانتقال"}</button></div>`;
  view.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    view.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true"); pick = +b.dataset.j; document.getElementById("go").disabled = false; }));
  document.getElementById("go").addEventListener("click", async () => {
    if (pick === null || busy) return; busy = true; document.getElementById("go").disabled = true;
    const res = await call({ action: "answer", token, index: r.index, choice: pick });
    busy = false;
    if (!res.ok) { if (res.error === "session_invalid") { saveToken(null); loginView(MSG.session_invalid); } else { document.getElementById("err").textContent = MSG[res.error] || MSG.server_error; document.getElementById("go").disabled = false; } return; }
    if (res.result === "time_over") alert_inline("انتهى الوقت قبل تأكيد هذه الإجابة، فلم تُحتسب.");
    render(res);
  });
  const tm = document.getElementById("tm"), end = new Date(r.deadline).getTime();
  const tick = async () => { const left = Math.max(0, end - (Date.now() + offset)), mm = Math.floor(left / 6e4), ss = Math.floor(left % 6e4 / 1e3);
    tm.textContent = `الوقت المتبقي ${mm}:${String(ss).padStart(2, "0")}`; tm.classList.toggle("low", left < 120000);
    if (left <= 0) { clearTimer(); const s = await call({ action: "state", token }); if (s.ok) render(s); } };
  tick(); timerId = setInterval(tick, 1000);
  window.scrollTo({ top: 0 });
}
let notice = "";
function alert_inline(t) { notice = t; }

function resultView(r) {
  clearTimer();
  view.innerHTML = `
  <h2>${r.status === "expired" ? "انتهى الوقت وسُلِّم الاختبار" : "تم تسليم الاختبار"}</h2>
  ${notice ? `<p class="err">${esc(notice)}</p>` : ""}
  <p>${esc(r.name)} · النموذج ${r.form}</p>
  <div class="score">${r.score} / ${r.total}</div>
  <p style="font-weight:600;margin:12px 0 6px">رقم الإيصال (النتيجة محفوظة لدى المعلم على الخادم)</p>
  <div class="code" id="rc">${esc(r.receipt)}</div>
  <div class="foot"><span class="note" id="cp"></span><button class="btn ghost" id="copy">نسخ رقم الإيصال</button></div>`;
  notice = "";
  document.getElementById("copy").addEventListener("click", () => { const cp = document.getElementById("cp");
    navigator.clipboard.writeText(r.receipt).then(() => cp.textContent = "تم النسخ.").catch(() => { const g = document.createRange(); g.selectNodeContents(document.getElementById("rc")); const s = getSelection(); s.removeAllRanges(); s.addRange(g); cp.textContent = "الرقم محدّد، انسخه يدويًا."; }); });
}

(async function boot() {
  if (!/^https?:\/\//.test(API)) { view.innerHTML = `<h2>الصفحة غير مهيّأة</h2><p>ضع رابط دالة الخادم في الثابت API داخل هذه الصفحة.</p>`; return; }
  if (token) { const s = await call({ action: "state", token }); if (s.ok) { render(s); return; } saveToken(null); }
  loginView();
})();
</script>
