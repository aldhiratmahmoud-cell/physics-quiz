<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>لوحة المعلم · اختبار الحركة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;800&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: one centered exam card per screen; header band in school navy, lime accents for progress */
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#1b2340; --muted:#5d6785; --line:#dde2ee;
  --navy:#24397c; --navy-ink:#ffffff; --lime:#7cbb2f; --lime-soft:#eef7e2; --gold:#e9a923;
  --sel:#e6ebfa; --sel-line:#24397c; --ok:#2e7d32; --bad:#c62828; --warn:#b26a00;
  --grid:#e3e7f1; --axis:#4a5372; --plot:#c62828;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-head:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1426; --card:#171e36; --ink:#e7ebf7; --muted:#9aa4c4; --line:#2a3354;
  --navy:#3b56b0; --navy-ink:#ffffff; --lime:#8fd03e; --lime-soft:#1e2b17; --gold:#f0b93f;
  --sel:#22305e; --sel-line:#8fa6ff; --ok:#66bb6a; --bad:#ef5350; --warn:#ffb74d;
  --grid:#2a3354; --axis:#aab3d3; --plot:#ff6b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1426; --card:#171e36; --ink:#e7ebf7; --muted:#9aa4c4; --line:#2a3354;
  --navy:#3b56b0; --navy-ink:#ffffff; --lime:#8fd03e; --lime-soft:#1e2b17; --gold:#f0b93f;
  --sel:#22305e; --sel-line:#8fa6ff; --ok:#66bb6a; --bad:#ef5350; --warn:#ffb74d;
  --grid:#2a3354; --axis:#aab3d3; --plot:#ff6b6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.band{background:var(--navy);color:var(--navy-ink);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.logo{width:64px;height:64px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.logo img{width:58px;height:auto}
.band h1{font-family:var(--f-head);font-size:1.15rem;margin:0;line-height:1.5;text-wrap:balance}
.band p{margin:0;opacity:.85;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h2{font-family:var(--f-head);font-size:1.25rem;margin:0 0 6px;text-wrap:balance}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.rule{background:var(--lime-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.rule b{display:block;font-family:var(--f-head);font-size:1.15rem;color:var(--ink)}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],input[type=password],textarea{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 200px;min-width:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--navy);color:var(--navy-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em;margin-top:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{font-size:.85rem;padding:4px 12px;border-radius:999px;background:var(--sel);font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--bad)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s}
.qtype{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.qtext{font-size:1.12rem;font-weight:500;margin:6px 0 10px}
.m{direction:ltr;unicode-bidi:isolate;font-family:var(--f-math);font-size:1.08em;white-space:nowrap}
.fig{direction:ltr;display:flex;justify-content:center;margin:6px 0 12px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.fig svg text{font-family:var(--f-body);fill:var(--axis)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sel);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--sel-line);background:var(--sel)}
.opt[aria-pressed="true"] .k{background:var(--navy);color:var(--navy-ink)}
.tf{grid-template-columns:1fr 1fr}
.note{font-size:.88rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.score{font-family:var(--f-head);font-size:2.6rem;color:var(--navy);margin:4px 0}
:root[data-theme="dark"] .score{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score{color:var(--lime)}}
.code{direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:12px;word-break:break-all;user-select:all}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--sel)}
td.ok{color:var(--ok);font-weight:700}td.bad{color:var(--bad);font-weight:700}
.prev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.prev .opt{cursor:default}
.prev .opt.right{border-color:var(--ok);background:var(--lime-soft)}
.stars{color:var(--gold);letter-spacing:2px}
@media (max-width:480px){.tf{grid-template-columns:1fr}.band h1{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<style>body{margin:0}</style>

    <div>
      <h1>روضة ومدارس ربوع البشر النموذجية</h1>
      <p>صفحة المعلم · الفيزياء · الصف العاشر · اختبار الحركة في بُعد واحد</p>
    </div>
  </header>
  <main id="view" class="card" aria-live="polite"></main>
</div>

<script>
"use strict";
const API = "https://iwssxlmdhdaanifbfzrt.supabase.co/functions/v1/quiz";
/* Teacher key lives in memory only (never stored). Every request is checked on the server. */
const AR = ["أ","ب","ج","د"];
const view = document.getElementById("view");
let KEY = "", tab = "results";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const EN = d => d ? new Date(d).toLocaleString("en-GB", { timeZone: "Asia/Amman", day: "2-digit", month: "short", hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true }) : "—";
async function call(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-teacher-key": KEY }, body: JSON.stringify(body) });
  let j = null; try { j = await r.json(); } catch (e) {}
  return j || { ok: false, error: "network" };
}
const ERR = { forbidden: "مفتاح المعلم غير صحيح.", too_many_attempts: "محاولات كثيرة خاطئة. انتظر 15 دقيقة.", network: "تعذّر الاتصال بالخادم.", server_error: "خطأ في الخادم." };

function keyView(msg) {
  view.innerHTML = `<h2>دخول المعلم</h2>
  <form id="f" novalidate autocomplete="off"><label for="k">مفتاح المعلم</label>
  <div class="row"><input id="k" type="password" dir="ltr"><button class="btn" style="flex:0 0 auto" type="submit">دخول</button></div>
  <div class="err">${esc(msg || "")}</div></form>`;
  document.getElementById("f").addEventListener("submit", async e => { e.preventDefault();
    KEY = document.getElementById("k").value.trim(); const r = await call({ action: "t_exam" });
    if (!r.ok) { KEY = ""; keyView(ERR[r.error] || ERR.server_error); return; }
    shell(r); });
}

function shell(examResp) {
  view.innerHTML = `
  <div class="top"><h2 style="margin:0">لوحة المعلم</h2><span class="pill" id="win" dir="ltr"></span></div>
  <div class="row" style="margin:14px 0">
    <button class="btn ghost" data-t="results">النتائج</button>
    <button class="btn ghost" data-t="receipt">التحقق من إيصال</button>
    <button class="btn ghost" data-t="preview">معاينة النماذج</button>
    <button class="btn ghost" data-t="window">موعد الاختبار</button>
  </div>
  <div id="pane"></div>`;
  const ex = examResp.exam;
  document.getElementById("win").textContent = `${EN(ex.opens_at)} – ${EN(ex.closes_at)} · ${ex.duration_s / 60} min`;
  view.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.t; go(ex); }));
  go(ex);
}
function go(ex) {
  view.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("ghost", b.dataset.t !== tab));
  ({ results, receipt, preview, window: windowPane })[tab](ex);
}
const pane = () => document.getElementById("pane");
const STATUS = { not_started: "لم يبدأ", in_progress: "يحلّ الآن", submitted: "سلّم", expired: "انتهى وقته" };

async function results() {
  pane().innerHTML = `<p class="note">جارٍ التحميل…</p>`;
  const r = await call({ action: "t_results" });
  if (!r.ok) { pane().innerHTML = `<p class="err">${esc(ERR[r.error] || r.error)}</p>`; return; }
  const done = r.rows.filter(x => x.score != null), avg = done.length ? (done.reduce((s, x) => s + x.score, 0) / done.length).toFixed(1) : "—";
  const qn = (r.rows.find(x => x.total) || {}).total || 11;
  pane().innerHTML = `
  <div class="rules"><div class="rule"><b>${r.rows.length}</b>طالبًا</div><div class="rule"><b>${done.length}</b>سلّموا</div><div class="rule"><b>${avg}</b>متوسط الدرجة من ${qn}</div></div>
  <div class="foot" style="margin:0 0 10px"><span class="note">وقت الخادم: ${EN(r.now)}</span><button class="btn" id="rf">تحديث</button></div>
  <div class="tablewrap"><table><thead><tr><th>م</th><th>الطالب</th><th>النموذج</th><th>الحالة</th>${Array.from({ length: qn }, (_, i) => `<th>س${i + 1}</th>`).join("")}<th>الدرجة</th><th>البدء</th><th>التسليم</th><th>الإيصال</th><th></th></tr></thead><tbody>
  ${r.rows.map(x => `<tr><td>${x.seq}</td><td style="text-align:right;white-space:nowrap">${esc(x.name)}</td><td>${x.form}</td><td>${STATUS[x.status] || x.status}</td>
    ${Array.from({ length: qn }, (_, i) => { const m = x.marks[i]; return m == null ? "<td>·</td>" : `<td class="${m ? "ok" : "bad"}">${m ? "✓" : "✗"}</td>`; }).join("")}
    <td><b>${x.score ?? "—"}</b></td><td dir="ltr">${EN(x.started_at)}</td><td dir="ltr">${EN(x.finished_at)}</td><td dir="ltr" style="white-space:nowrap">${esc(x.receipt || "")}</td>
    <td>${x.status !== "not_started" ? `<button class="btn ghost" style="padding:2px 10px" data-reset="${x.student_id}" data-name="${esc(x.name)}">إعادة</button>` : ""}</td></tr>`).join("")}
  </tbody></table></div><div id="conf"></div>`;
  document.getElementById("rf").addEventListener("click", results);
  pane().querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", () => {
    document.getElementById("conf").innerHTML = `<div class="prev"><p><b>حذف محاولة ${esc(b.dataset.name)} والسماح له بالبدء من جديد؟</b> تُحذف إجاباته ونتيجته نهائيًا.</p>
    <div class="row" style="max-width:420px"><button class="btn" id="yes">نعم، احذف المحاولة</button><button class="btn ghost" id="no">إلغاء</button></div></div>`;
    document.getElementById("no").onclick = () => document.getElementById("conf").innerHTML = "";
    document.getElementById("yes").onclick = async () => { const rr = await call({ action: "t_reset", student_id: b.dataset.reset }); if (rr.ok) results(); };
  }));
}

function receipt() {
  pane().innerHTML = `<form id="rf" novalidate><label for="rc">رقم الإيصال</label><div class="row"><input id="rc" type="text" dir="ltr" placeholder="R-XXXX-XXXX-XXXX"><button class="btn" style="flex:0 0 auto" type="submit">تحقّق</button></div></form><div id="out" style="margin-top:12px"></div>`;
  document.getElementById("rf").addEventListener("submit", async e => { e.preventDefault();
    const r = await call({ action: "t_receipt", receipt: document.getElementById("rc").value });
    const o = document.getElementById("out");
    if (!r.ok) { o.innerHTML = `<p class="err">${esc(ERR[r.error] || r.error)}</p>`; return; }
    o.innerHTML = r.valid ? `<div class="rule"><b>إيصال صحيح ✓</b>${esc(r.display_name)} · النموذج ${r.form_no} · الدرجة ${r.score} / ${r.q_count} · ${r.status === "expired" ? "سُلّم بانتهاء الوقت" : "سلّمه الطالب"} · ${EN(r.finished_at)}</div>`
                          : `<p class="err">لا يوجد إيصال بهذا الرقم. الإيصال مزوّر أو مكتوب خطأ.</p>`; });
}

async function preview(ex) {
  pane().innerHTML = `<div class="row" style="max-width:420px"><label for="pf" style="margin:0">النموذج</label><input id="pf" type="number" min="1" max="${ex.form_count}" value="1"><button class="btn" id="pb" style="flex:0 0 auto">عرض</button></div><div id="pv"></div>`;
  const show = async () => { const f = +document.getElementById("pf").value; const r = await call({ action: "t_preview", form: f });
    const pv = document.getElementById("pv"); if (!r.ok) { pv.innerHTML = `<p class="err">${esc(r.error)}</p>`; return; }
    pv.innerHTML = r.questions.map((q, i) => `<div class="prev"><div class="qtype">السؤال ${i + 1} · ${esc(q.idea)}</div><div class="qtext">${q.text}</div>${q.fig || ""}
      <div class="opts ${q.kind === "tf" ? "tf" : ""}">${q.options.map((o, j) => `<div class="opt ${j === q.correct ? "right" : ""}"><span class="k">${q.kind === "mc" ? AR[j] : (j === 0 ? "✓" : "✗")}</span><span>${o}</span></div>`).join("")}</div></div>`).join(""); };
  document.getElementById("pb").addEventListener("click", show); show();
}

async function windowPane(ex) {
  const toLocal = d => { const x = new Date(new Date(d).getTime() + 3 * 3600e3); return x.toISOString().slice(0, 16); };
  pane().innerHTML = `<p class="note">الأوقات بتوقيت عمّان (UTC+3). يحدّد الخادم الفتح والإغلاق ومدة كل محاولة؛ ساعة جهاز الطالب لا تؤثر.</p>
  <form id="wf" novalidate><div class="row">
    <div><label for="o">Opens</label><input id="o" type="datetime-local" value="${toLocal(ex.opens_at)}"></div>
    <div><label for="c">Closes</label><input id="c" type="datetime-local" value="${toLocal(ex.closes_at)}"></div>
    <div><label for="d">مدة المحاولة (دقيقة)</label><input id="d" type="number" min="1" max="240" value="${ex.duration_s / 60}"></div>
  </div><div class="foot"><span class="note" id="wm"></span><button class="btn" type="submit">حفظ الموعد</button></div></form>`;
  document.getElementById("wf").addEventListener("submit", async e => { e.preventDefault();
    const r = await call({ action: "t_set_window", opens_at: document.getElementById("o").value + ":00+03:00", closes_at: document.getElementById("c").value + ":00+03:00", duration_s: Math.round(+document.getElementById("d").value * 60) });
    document.getElementById("wm").textContent = r.ok ? "تم الحفظ على الخادم." : "لم يُحفظ: تحقّق من القيم.";
    if (r.ok) { const e2 = await call({ action: "t_exam" }); shell(e2); tab = "window"; go(e2.exam); } });
}

if (!/^https?:\/\//.test(API)) view.innerHTML = `<h2>الصفحة غير مهيّأة</h2><p>ضع رابط دالة الخادم في الثابت API داخل هذه الصفحة.</p>`;
else keyView();
</script>

</body></html>
